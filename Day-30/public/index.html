<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TITAN | Digital Marketplace</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">TITAN</div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search products...">
        </div>
        <div class="cart-icon" id="cart-toggle">
            🛒 Cart (<span id="cart-count">0</span>)
        </div>
    </header>

    <main class="container">
        <aside class="sidebar">
            <h3>Categories</h3>
            <ul id="category-list">
                <li data-category="all" class="active">All Products</li>
                <li data-category="electronics">Electronics</li>
                <li data-category="furniture">Furniture</li>
                <li data-category="accessories">Accessories</li>
            </ul>
        </aside>

        <section class="product-grid" id="product-grid">
            <div class="loader">Loading products...</div>
        </section>
    </main>
    <div id="checkout-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <h2>Review Your Cart</h2>
            
            <div id="cart-items-container">
                </div>
            <div class="cart-total">
                Total: $<span id="cart-total-price">0.00</span>
            </div>

            <h3>Shipping Details</h3>
            <form id="checkout-form">
                <input type="text" id="cust-name" placeholder="Full Name" required>
                <input type="email" id="cust-email" placeholder="Email Address" required>
                <textarea id="cust-address" placeholder="Full Shipping Address" rows="3" required></textarea>
                <button type="submit" class="checkout-btn">Place Secure Order</button>
            </form>
        </div>
    </div>

    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
</body>
</html>

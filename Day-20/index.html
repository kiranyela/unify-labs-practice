<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Weather Dashboard</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Weather Dashboard</h1>
        </header>

        <section class="search-section">
            <input type="text" id="city-input" placeholder="Enter city name..." aria-label="City Name">
            <button id="search-btn">Get Weather</button>
        </section>

        <div id="status-message" class="status-message" aria-live="polite"></div>

        <article id="weather-card" class="weather-card hidden">
            <h2 id="city-name"></h2>
            <div class="weather-details">
                <p class="temp"><span id="temperature"></span>&deg;C</p>
                <p class="desc" id="description"></p>
                <div class="metrics">
                    <p>Humidity: <span id="humidity"></span>%</p>
                    <p>Wind: <span id="wind-speed"></span> m/s</p>
                </div>
            </div>
        </article>
    </main>

    <script src="app.js"></script>
</body>
</html>

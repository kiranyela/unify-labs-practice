<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram • Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="login-container">
        <div class="phone-mockup">
        </div>

        <div class="login-section">
            <div class="box login-box">
                <h1 class="logo">Instagram</h1>
                
                <form class="login-form">
                    <div class="input-group">
                        <input type="text" id="username" required minlength="1" placeholder=" ">
                        <label for="username">Phone number, username, or email</label>
                    </div>
                    
                    <div class="input-group">
                        <input type="password" id="password" required minlength="6" placeholder=" ">
                        <label for="password">Password</label>
                    </div>

                    <button type="submit" class="btn-primary">Log in</button>

                    <div class="divider">
                        <div class="line"></div>
                        <div class="or">OR</div>
                        <div class="line"></div>
                    </div>

                    <a href="#" class="fb-login">
                        <span class="fb-icon">f</span> Log in with Facebook
                    </a>
                    
                    <a href="#" class="forgot-password">Forgot password?</a>
                </form>
            </div>

            <div class="box signup-box">
                <p>Don't have an account? <a href="#">Sign up</a></p>
            </div>

            <div class="app-download">
                <p>Get the app.</p>
                <div class="store-buttons">
                    <div class="store-btn google-play"></div>
                    <div class="store-btn microsoft"></div>
                </div>
            </div>
        </div>
    </main>
    
    <footer class="site-footer">
        <div class="links">
            <a href="#">Meta</a>
            <a href="#">About</a>
            <a href="#">Blog</a>
            <a href="#">Jobs</a>
            <a href="#">Help</a>
            <a href="#">API</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
            <a href="#">Top Accounts</a>
            <a href="#">Locations</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Contact Uploading & Non-Users</a>
        </div>
        <div class="copyright">
            <select>
                <option value="en">English</option>
            </select>
            <span>© 2026 Instagram from Meta</span>
        </div>
    </footer>
</body>
</html>

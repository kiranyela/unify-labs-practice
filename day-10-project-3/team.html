<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Team • Instagram</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #FAFAFA;
        }
    </style>
</head>
<body>
    <header class="team-header">
        <div class="container">
            <h1>Our Team</h1>
            <p>Meet the people behind the lens.</p>
        </div>
    </header>

    <main class="team-container container">
        <div class="team-grid">
            <div class="team-card">
                <div class="card-image">
                    <img src="assets/member1.jpg" alt="Team Member" onerror="this.src='https://via.placeholder.com/300x300/dbdbdb/262626?text=Photo'">
                    <div class="social-overlay">
                        <a href="#" class="social-link">IG</a>
                        <a href="#" class="social-link">X</a>
                        <a href="#" class="social-link">in</a>
                    </div>
                </div>
                <div class="card-info">
                    <h3>Alex Doe</h3>
                    <span class="role">Lead Designer</span>
                </div>
            </div>

            <div class="team-card">
                <div class="card-image">
                    <img src="assets/member2.jpg" alt="Team Member" onerror="this.src='https://via.placeholder.com/300x300/dbdbdb/262626?text=Photo'">
                    <div class="social-overlay">
                        <a href="#" class="social-link">IG</a>
                        <a href="#" class="social-link">X</a>
                        <a href="#" class="social-link">in</a>
                    </div>
                </div>
                <div class="card-info">
                    <h3>Sarah Smith</h3>
                    <span class="role">Senior Developer</span>
                </div>
            </div>

            <div class="team-card">
                <div class="card-image">
                    <img src="assets/member3.jpg" alt="Team Member" onerror="this.src='https://via.placeholder.com/300x300/dbdbdb/262626?text=Photo'">
                    <div class="social-overlay">
                        <a href="#" class="social-link">IG</a>
                        <a href="#" class="social-link">X</a>
                        <a href="#" class="social-link">in</a>
                    </div>
                </div>
                <div class="card-info">
                    <h3>Mike Johnson</h3>
                    <span class="role">Product Manager</span>
                </div>
            </div>

            <div class="team-card">
                <div class="card-image">
                    <img src="assets/member4.jpg" alt="Team Member" onerror="this.src='https://via.placeholder.com/300x300/dbdbdb/262626?text=Photo'">
                    <div class="social-overlay">
                        <a href="#" class="social-link">IG</a>
                        <a href="#" class="social-link">X</a>
                        <a href="#" class="social-link">in</a>
                    </div>
                </div>
                <div class="card-info">
                    <h3>Emily Davis</h3>
                    <span class="role">Marketing Lead</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - DevConf 2026</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

    <nav>
        <div class="container">
            <div class="logo">Dev<span>Conf</span> 2026</div>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="speakers.html">Speakers</a></li>
                <li><a href="schedule.html">Schedule</a></li>
                <li><a href="sponsors.html">Sponsors</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </div>
    </nav>
    <hr style="margin: 0;">

    <header class="page-header">
        <div class="container">
            <h1>Contact Us</h1>
        </div>
    </header>

    <main class="container">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 3rem;">
            <!-- Contact Form -->
            <section>
                <h2>Send us a Message</h2>
                <form action="#" method="POST" style="margin: 0;">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>

                    <button type="submit" class="btn">Send Message</button>
                </form>
            </section>
            
            <!-- Info -->
            <section>
                <h2>Get in Touch</h2>
                <address style="margin-bottom: 2rem; font-style: normal; font-size: 1.1rem;">
                    <strong>DevConf Headquarters</strong><br>
                    123 Tech Boulevard<br>
                    Innovation City, CA 94000<br>
                    <br>
                    <a href="mailto:info@devconf2026.com">info@devconf2026.com</a>
                </address>

                <!-- Map Placeholder -->
                <div style="background: #e2e8f0; height: 300px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #64748b;">
                    Google Map Embed
                </div>
            </section>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 DevConf. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
